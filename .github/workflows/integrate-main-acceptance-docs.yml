name: Integrate main acceptance docs

on:
  push:
    branches: [agent/workspace-main-acceptance-policy]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/workspace-main-acceptance-policy

      - name: Add the portable acceptance section
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text()
          old = "Proposal visibility and reviewer statements do not by themselves authorize\n`main`. A later explicit workspace policy evaluates exact proposal and review\nroots before accepting a shared head. See\n[`docs/workspace-proposals.md`](docs/workspace-proposals.md) and\n[`docs/workspace-reviews.md`](docs/workspace-reviews.md).\n\n## Convex-style accounts and actors"
          new = "Proposal visibility and reviewer statements do not by themselves authorize\n`main`. See [`docs/workspace-proposals.md`](docs/workspace-proposals.md) and\n[`docs/workspace-reviews.md`](docs/workspace-reviews.md).\n\n## Policy-gated workspace main\n\n[`ignatius.workspace-acceptance`](hal/src/ignatius/workspace_acceptance.hal)\ndefines the first executable shared-head law. A create-only `policy/main`\nattestation pins one authority and an exact ordered reviewer set. An acceptance\nattestation then pins the proposed candidate, policy root, current approval\nroots, and exact previous `main` root.\n\nV1 requires every listed reviewer to have a current `:approve` decision.\nSuperseded approvals, rejects, withdrawals, unpublished candidates, non-genesis\nbootstrap attempts and non-fast-forward updates are rejected before ref CAS. The\nportable adapter proves the policy algebra; signed PostgreSQL admission is the\nnext delivery slice. See\n[`docs/workspace-main-acceptance.md`](docs/workspace-main-acceptance.md).\n\n## Convex-style accounts and actors"
          if old not in text:
              raise SystemExit("README acceptance marker not found")
          path.write_text(text.replace(old, new, 1))
          PY

          rm .github/workflows/integrate-main-acceptance-docs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/integrate-main-acceptance-docs.yml
          git commit -m "Document portable workspace main acceptance"
          git push origin HEAD:agent/workspace-main-acceptance-policy
