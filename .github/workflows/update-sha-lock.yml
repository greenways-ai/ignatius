name: Update SHA lockfile

on:
  push:
    branches: [agent/import-hestia]
    paths:
      - .github/workflows/update-sha-lock.yml

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/import-hestia
          fetch-depth: 0

      - name: Materialize pinned Hara source
        run: make setup

      - name: Generate and test the locked provider
        run: |
          cargo generate-lockfile --manifest-path extensions/sha/rust/Cargo.toml
          cargo test --locked --manifest-path extensions/sha/rust/Cargo.toml

      - name: Commit lockfile
        run: |
          git config user.name "greenways-ai-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/update-sha-lock.yml
          git add extensions/sha/rust/Cargo.lock .github/workflows/update-sha-lock.yml
          git commit -m "build: lock the Ignatius SHA provider"
          git push origin HEAD:agent/import-hestia
