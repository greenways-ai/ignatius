name: Refresh SHA extension lock

on:
  pull_request:

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Materialize pinned Hara
        run: make setup

      - name: Update only the Hara path package
        run: |
          set -euo pipefail
          cargo update \
            --manifest-path extensions/sha/rust/Cargo.toml \
            -p hara-wasm

      - name: Commit a changed lockfile
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- extensions/sha/rust/Cargo.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extensions/sha/rust/Cargo.lock
          git commit -m "Refresh SHA extension lock for pinned Hara"
          git push origin "HEAD:${TARGET_BRANCH}"
