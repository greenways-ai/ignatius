name: GitHub Agent Workflow

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile GitHub adapter
        run: |
          python3 -m py_compile \
            scripts/ignatius_github_common.py \
            scripts/ignatius_github_issue.py \
            scripts/ignatius_github_outbox.py \
            scripts/ignatius_github_pull.py \
            scripts/ignatius_github_push.py \
            scripts/ignatius_github_check.py \
            scripts/ignatius-github-event \
            scripts/test-ignatius-github-event \
            scripts/test-ignatius-github-push \
            scripts/test-ignatius-github-check \
            scripts/test-ignatius-github-pull
      - name: Test issue creation, lifecycle snapshots and durable replay
        run: python3 scripts/test-ignatius-github-event
      - name: Test exact Git branch resources and force-push ancestry
        run: python3 scripts/test-ignatius-github-push
      - name: Test completed check evidence and assignee checkpoint payloads
        run: python3 scripts/test-ignatius-github-check
      - name: Test exact pull-request snapshots and constrained proposal intents
        run: python3 scripts/test-ignatius-github-pull
