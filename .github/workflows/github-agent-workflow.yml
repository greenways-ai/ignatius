name: GitHub Agent Workflow

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile GitHub adapter
        run: |
          python3 -m py_compile \
            scripts/ignatius_github_common.py \
            scripts/ignatius_github_issue.py \
            scripts/ignatius_github_outbox.py \
            scripts/ignatius_github_pull.py \
            scripts/ignatius_github_pull_lifecycle.py \
            scripts/ignatius_github_review.py \
            scripts/ignatius_github_push.py \
            scripts/ignatius_github_check.py \
            scripts/ignatius-github-event \
            scripts/test-ignatius-github-event \
            scripts/test-ignatius-github-push \
            scripts/test-ignatius-github-check \
            scripts/test-ignatius-github-pull \
            scripts/test-ignatius-github-pull-lifecycle \
            scripts/test-ignatius-github-review \
            scripts/ignatius-agent \
            scripts/ignatius_agent_status_common.py \
            scripts/ignatius_agent_status_sqlite.py \
            scripts/ignatius-agent-workflow-status \
            scripts/test-ignatius-agent-workflow-status \
            scripts/ignatius_agent_github_review_materialize.py \
            scripts/ignatius-agent-github-review-materialize \
            scripts/test-ignatius-agent-github-review-materialize
      - name: Test issue creation, lifecycle snapshots and durable replay
        run: python3 scripts/test-ignatius-github-event
      - name: Test exact Git branch resources and force-push ancestry
        run: python3 scripts/test-ignatius-github-push
      - name: Test completed check evidence and assignee checkpoint payloads
        run: python3 scripts/test-ignatius-github-check
      - name: Test exact pull-request snapshots and constrained proposal intents
        run: python3 scripts/test-ignatius-github-pull
      - name: Test exact pull-request lifecycle snapshots
        run: python3 scripts/test-ignatius-github-pull-lifecycle
      - name: Test exact pull-request review snapshots
        run: python3 scripts/test-ignatius-github-review
      - name: Test sanitized Agent Workflow operational status
        run: scripts/test-ignatius-agent-workflow-status
      - name: Test signer-visible GitHub review materialization
        run: python3 scripts/test-ignatius-agent-github-review-materialize
