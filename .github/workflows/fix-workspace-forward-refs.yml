name: Fix workspace compiler ordering

on:
  push:
    branches: [agent/workspace-commit-postgres]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/workspace-commit-postgres

      - name: Replace mutual recursion and reorder helpers
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("db/src/gwdb/ledger/workspace.clj")
          text = path.read_text()

          old_version = "(== (cell/cell-type-tag v-version-root) 3)"
          if old_version not in text:
              raise SystemExit("workspace record-version type-tag marker not found")
          text = text.replace(
              old_version,
              "(== (cell/cell-type-tag v-version-root) 2)",
              1,
          )

          ancestry_start_marker = """(defn.pg ^{:- [:boolean]}
            workspace-commit-ancestor"""
          ancestry_end_marker = """(defn.pg ^{:- [:boolean]}
            merge-base-valid-at"""
          ancestry_start = text.index(ancestry_start_marker)
          ancestry_end = text.index(ancestry_end_marker, ancestry_start)
          ancestry = '''(defn.pg ^{:- [:boolean]}
            workspace-commit-root-seen-at
            "Checks a deterministic JSONB commit-root list."
            {:added "0.11"}
            [:jsonb i-roots :bytea i-root :integer i-position :integer i-count]
            (cond (>= i-position i-count)
                  (return false)

                  :else
                  (let [(:bytea v-current)
                        (:bytea
                         (:->> (:-> i-roots i-position) "commit_root"))]
                    (cond (== v-current i-root)
                          (return true)

                          :else
                          (return
                           (-/workspace-commit-root-seen-at
                            i-roots i-root (+ i-position 1) i-count))))))

          (defn.pg ^{:- [:jsonb]}
            workspace-commit-root-tail
            "Copies a deterministic JSONB commit-root suffix."
            {:added "0.11"}
            [:jsonb i-roots :integer i-position :integer i-count :jsonb i-out]
            (cond (>= i-position i-count)
                  (return i-out)

                  :else
                  (let [(:jsonb v-root) (:-> i-roots i-position)
                        (:jsonb v-next)
                        (|| i-out (pg/jsonb-build-array v-root))]
                    (return
                     (-/workspace-commit-root-tail
                      i-roots (+ i-position 1) i-count v-next)))))

          (defn.pg ^{:- [:jsonb]}
            workspace-commit-parent-entries-at
            "Builds ordered parent-root entries for deterministic traversal."
            {:added "0.11"}
            [:bytea i-commit-root
             :integer i-position
             :integer i-count
             :jsonb i-out]
            (cond (>= i-position i-count)
                  (return i-out)

                  :else
                  (let [(:bytea v-parent-root)
                        (-/workspace-commit-parent-root
                         i-commit-root i-position)
                        (:jsonb v-entry)
                        (pg/jsonb-build-object
                         "commit_root" v-parent-root)
                        (:jsonb v-next)
                        (|| i-out (pg/jsonb-build-array v-entry))]
                    (return
                     (-/workspace-commit-parent-entries-at
                      i-commit-root (+ i-position 1) i-count v-next)))))

          (defn.pg ^{:- [:jsonb]}
            workspace-commit-parent-entries
            {:added "0.11"}
            [:bytea i-commit-root]
            (return
             (-/workspace-commit-parent-entries-at
              i-commit-root 0
              (-/workspace-commit-parent-count i-commit-root)
              (pg/jsonb-build-array))))

          (defn.pg ^{:- [:boolean]}
            workspace-commit-ancestor-at
            "Walks one pending-root queue without mutually recursive functions."
            {:added "0.11"}
            [:bytea i-ancestor-root :jsonb i-pending :jsonb i-seen]
            (let [(:integer v-pending-count)
                  (pg/jsonb-array-length i-pending)]
              (cond (== v-pending-count 0)
                    (return false)

                    :else
                    (let [(:jsonb v-first) (:-> i-pending 0)
                          (:bytea v-root)
                          (:bytea (:->> v-first "commit_root"))
                          (:integer v-seen-count)
                          (pg/jsonb-array-length i-seen)
                          (:boolean v-seen)
                          (-/workspace-commit-root-seen-at
                           i-seen v-root 0 v-seen-count)
                          (:jsonb v-tail)
                          (-/workspace-commit-root-tail
                           i-pending 1 v-pending-count
                           (pg/jsonb-build-array))
                          (:jsonb v-parents)
                          (-/workspace-commit-parent-entries v-root)
                          (:jsonb v-next-pending)
                          (pg/case v-seen v-tail
                                   :else (|| v-parents v-tail))
                          (:jsonb v-next-seen)
                          (pg/case v-seen i-seen
                                   :else
                                   (|| i-seen
                                       (pg/jsonb-build-array v-first)))]
                      (cond (== i-ancestor-root v-root)
                            (return true)

                            :else
                            (return
                             (-/workspace-commit-ancestor-at
                              i-ancestor-root
                              v-next-pending v-next-seen)))))))

          (defn.pg ^{:- [:boolean]}
            workspace-commit-ancestor
            "Checks ancestry in the verified parent-before-child projection."
            {:added "0.11"}
            [:bytea i-ancestor-root :bytea i-descendant-root]
            (cond (== i-ancestor-root i-descendant-root)
                  (return true)

                  [(-/workspace-commit-row i-descendant-root) :is-null]
                  (return false)

                  :else
                  (return
                   (-/workspace-commit-ancestor-at
                    i-ancestor-root
                    (pg/jsonb-build-array
                     (pg/jsonb-build-object
                      "commit_root" i-descendant-root))
                    (pg/jsonb-build-array)))))

          '''
          text = text[:ancestry_start] + ancestry + text[ancestry_end:]

          nullable_helper_marker = """(defn.pg ^{:- [:boolean]}
            workspace-commit-valid"""
          nullable_helper = '''(defn.pg ^{:- [:boolean]}
            optional-root-equal
            "Compares nullable roots with SQL NULL-safe semantics."
            {:added "0.11"}
            [:bytea i-left :bytea i-right]
            (return
             (pg/case [i-left :is-null]
                      [i-right :is-null]
                      [i-right :is-null]
                      false
                      :else
                      (== i-left i-right))))

          '''
          nullable_insert = text.index(nullable_helper_marker)
          text = text[:nullable_insert] + nullable_helper + text[nullable_insert:]

          replacements = {
              '''(== (:bytea (:->> o-row "workspace_root"))
                          (-/optional-field i-commit-root "workspace/root"))''':
              '''(-/optional-root-equal
                          (:bytea (:->> o-row "workspace_root"))
                          (-/optional-field i-commit-root "workspace/root"))''',
              '''(== (:bytea (:->> o-row "operation_root"))
                          (-/optional-field i-commit-root "commit/operation-root"))''':
              '''(-/optional-root-equal
                          (:bytea (:->> o-row "operation_root"))
                          (-/optional-field i-commit-root "commit/operation-root"))''',
              '''(== (:bytea (:->> o-row "merge_base_root"))
                          (-/optional-field i-commit-root "commit/merge-base-root"))''':
              '''(-/optional-root-equal
                          (:bytea (:->> o-row "merge_base_root"))
                          (-/optional-field i-commit-root "commit/merge-base-root"))''',
              '''(== (:bytea (:->> o-row "merge_policy_root"))
                          (-/optional-field i-commit-root "commit/merge-policy-root"))''':
              '''(-/optional-root-equal
                          (:bytea (:->> o-row "merge_policy_root"))
                          (-/optional-field i-commit-root "commit/merge-policy-root"))''',
              '''(== (:bytea (:->> o-row "execution_provenance_root"))
                          (-/optional-field
                           i-commit-root "commit/execution-provenance"))''':
              '''(-/optional-root-equal
                          (:bytea (:->> o-row "execution_provenance_root"))
                          (-/optional-field
                           i-commit-root "commit/execution-provenance"))''',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"nullable projection marker not found: {old}")
              text = text.replace(old, new, 1)

          parent_import_start_marker = """(defn.pg ^{:- [:boolean]}
            workspace-commit-parent-import-at"""
          parent_import_end_marker = """(defn.pg ^{:- [:bytea]}
            workspace-commit-put"""
          import_marker = """(defn.pg ^{:- [:bytea]}
            workspace-commit-import"""
          parent_import_start = text.index(parent_import_start_marker)
          parent_import_end = text.index(
              parent_import_end_marker, parent_import_start
          )
          parent_import_block = text[parent_import_start:parent_import_end]
          text = text[:parent_import_start] + text[parent_import_end:]
          import_position = text.index(import_marker)
          text = (
              text[:import_position]
              + parent_import_block
              + text[import_position:]
          )

          path.write_text(text)
          PY

          rm .github/workflows/fix-workspace-forward-refs.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/src/gwdb/ledger/workspace.clj \
                  .github/workflows/fix-workspace-forward-refs.yml
          git commit -m "Fix workspace SQL compiler ordering"
          git push origin HEAD:agent/workspace-commit-postgres
