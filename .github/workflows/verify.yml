name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  chain-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Test Git workflow event adapter
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/ignatius-git-event

          repo="$(mktemp -d)"
          trap 'rm -rf "$repo"' EXIT
          git -C "$repo" init -q
          git -C "$repo" config user.email test@example.com
          git -C "$repo" config user.name "Ignatius Test"
          git -C "$repo" remote add origin \
            'https://secret-user:secret-pass@example.com/owner/repo.git?token=bad#fragment'

          printf 'first\n' > "$repo/README.md"
          git -C "$repo" add README.md
          git -C "$repo" commit -qm first
          first="$(git -C "$repo" rev-parse HEAD)"

          initial="$(
            scripts/ignatius-git-event resource \
              --workspace test/workspace \
              --resource-id git/test/main \
              --repo "$repo" \
              --initial
          )"
          grep -q ':action :resource/register' <<< "$initial"
          grep -q ':resource/previous-version nil' <<< "$initial"
          grep -q 'https://example.com/owner/repo.git' <<< "$initial"
          ! grep -q 'secret\|token=bad\|#fragment' <<< "$initial"

          printf 'second\n' >> "$repo/README.md"
          git -C "$repo" add README.md
          git -C "$repo" commit -qm second
          second="$(git -C "$repo" rev-parse HEAD)"

          advanced="$(
            scripts/ignatius-git-event resource \
              --workspace test/workspace \
              --resource-id git/test/main \
              --repo "$repo" \
              --previous-version "$first"
          )"
          grep -q ":resource/version \"$second\"" <<< "$advanced"
          grep -q ":resource/previous-version \"$first\"" <<< "$advanced"
          grep -q ":resource/parent-versions \[\"$first\"\]" <<< "$advanced"

          created="$(
            scripts/ignatius-git-event work-create \
              --workspace test/workspace \
              --work-id work/change \
              --title 'Change the repository' \
              --definition-root definition/change \
              --input "git/test/main=$second"
          )"
          grep -q ':action :work/create' <<< "$created"
          grep -q ':reference/kind :resource/version' <<< "$created"

      - name: Reject Hestia application modules
        run: |
          set -euo pipefail
          if grep -R -n -E 'gwdb\.ledger\.(ot|document|document-protocol)' \
              db/src db/sql db/contracts; then
            echo "Hestia application modules must not enter Ignatius" >&2
            exit 1
          fi
          if grep -R -n -E '^\(ns gw\.ledger\.' hal extensions; then
            echo "Portable HAL must use Ignatius namespaces" >&2
            exit 1
          fi
          if grep -R -n -E 'gw/ledger|greenways-ledger' hal extensions; then
            echo "Portable packages must publish Ignatius identities" >&2
            exit 1
          fi

      - name: Install Leiningen
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-delay 2 \
            https://raw.githubusercontent.com/technomancy/leiningen/stable/bin/lein \
            -o /tmp/lein
          chmod +x /tmp/lein
          sudo mv /tmp/lein /usr/local/bin/lein
          lein version

      - name: Materialize pinned source dependencies
        run: make setup

      - name: Report pinned generator toolchain
        run: |
          set -euo pipefail
          java -version
          lein version
          printf 'Hara:       %s\n' "$(git -C .local/hara.lang rev-parse HEAD)"
          printf 'Foundation: %s\n' "$(git -C db/checkouts/foundation rev-parse HEAD)"

      - name: Keep protocol intrinsics at the top-level adapter
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("db/src/gwdb/ledger/runtime_v2.clj")
          text = path.read_text()
          original = text
          text = text.replace(
              "            [gwdb.ledger.protocol :as protocol]\n", "")

          start_marker = '              (cond (== v-id "protocol/define")'
          end_marker = '\n\n            [o-function :is-not-null]'
          if start_marker in text:
              start = text.index(start_marker)
              end = text.index(end_marker, start)
              text = (
                  text[:start]
                  + "              (return (support/apply-primitive\n"
                    "                       i-context-root v-id i-roots)))"
                  + text[end:]
              )

          if text != original:
              path.write_text(text)
          PY
          if git diff --quiet -- db/src/gwdb/ledger/runtime_v2.clj; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/src/gwdb/ledger/runtime_v2.clj
          git commit -m "Keep protocol intrinsics at the signed adapter"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Generate SQL
        run: |
          set +e
          set -o pipefail
          rm -f /tmp/clojure-*.edn /tmp/db-sql.log
          make db-sql 2>&1 | tee /tmp/db-sql.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::group::SQL generator output"
            tail -n 400 /tmp/db-sql.log
            for report in /tmp/clojure-*.edn; do
              [ -f "$report" ] && { echo "--- $report"; cat "$report"; }
            done
            echo "::endgroup::"
            message="$(tail -n 35 /tmp/db-sql.log | tr '\n' ' ' | sed 's/%/%25/g')"
            echo "::error title=SQL generation failed::${message}"
            exit "$status"
          fi

      - name: Generate client contracts
        run: |
          set +e
          set -o pipefail
          rm -f /tmp/clojure-*.edn /tmp/db-contracts.log
          make db-contracts 2>&1 | tee /tmp/db-contracts.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::group::Contract generator output"
            tail -n 400 /tmp/db-contracts.log
            for report in /tmp/clojure-*.edn; do
              [ -f "$report" ] && { echo "--- $report"; cat "$report"; }
            done
            echo "::endgroup::"
            message="$(tail -n 35 /tmp/db-contracts.log | tr '\n' ' ' | sed 's/%/%25/g')"
            echo "::error title=Client contract generation failed::${message}"
            exit "$status"
          fi

      - name: Build pinned Hara CLI
        run: |
          set -euo pipefail
          cargo build \
            --locked \
            --release \
            --bin hara \
            --manifest-path .local/hara.lang/core/rust/Cargo.toml

      - name: Check and test portable HAL
        run: |
          set -euo pipefail
          export PATH="$PWD/.local/hara.lang/core/rust/target/release:$PATH"
          hara --version
          make hal-check
          make hal-test

      - name: Commit regenerated runtime artefacts
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet -- db/sql/full.sql db/contracts/ledger-client/generated.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/sql/full.sql db/contracts/ledger-client/generated.ts
          git commit -m "Regenerate ledger artefacts"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Test signed workspace releases, main, policies, reviews, proposals, refs and runtime contracts
        run: |
          docker build \
            -t gw-ledger-postgres:15-pgsodium \
            -f db/Dockerfile.postgres15-pgsodium \
            db
          cd db
          lein update-in :dependencies conj \
            '[org.clojure/core.rrb-vector "0.1.2"]' \
            '[org.apache.commons/commons-math3 "3.6.1"]' -- \
            test gwdb.ledger.workspace-test \
                 gwdb.ledger.workspace-admission-test \
                 gwdb.ledger.workspace-proposal-test \
                 gwdb.ledger.workspace-review-test \
                 gwdb.ledger.workspace-acceptance-test \
                 gwdb.ledger.workspace-main-test \
                 gwdb.ledger.workspace-release-test \
                 gwdb.ledger.scoped-ref-test \
                 gwdb.ledger.protocol-value-test \
                 gwdb.ledger.runtime-v2-demo-test \
                 gwdb.ledger.actor-runtime-test \
                 gwdb.ledger.contract-runtime-test

      - name: Test SHA extension with a current lockfile
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          manifest=extensions/sha/rust/Cargo.toml
          lockfile=extensions/sha/rust/Cargo.lock

          if ! cargo metadata \
              --locked \
              --format-version 1 \
              --manifest-path "$manifest" >/dev/null 2>&1; then
            cargo metadata \
              --format-version 1 \
              --manifest-path "$manifest" >/dev/null
          fi

          cargo test --locked --manifest-path "$manifest"

          if git diff --quiet -- "$lockfile"; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$lockfile"
          git commit -m "Regenerate SHA extension lockfile"
          git push origin "HEAD:${TARGET_BRANCH}"
