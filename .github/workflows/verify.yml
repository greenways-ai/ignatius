name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  chain-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Reject Hestia application modules
        run: |
          set -euo pipefail
          if grep -R -n -E 'gwdb\.ledger\.(ot|document|document-protocol)' \
              db/src db/sql db/contracts; then
            echo "Hestia application modules must not enter Ignatius" >&2
            exit 1
          fi
          if grep -R -n -E '^\(ns gw\.ledger\.' hal extensions; then
            echo "Portable HAL must use Ignatius namespaces" >&2
            exit 1
          fi
          if grep -R -n -E 'gw/ledger|greenways-ledger' hal extensions; then
            echo "Portable packages must publish Ignatius identities" >&2
            exit 1
          fi

      - name: Install Leiningen
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-delay 2 \
            https://raw.githubusercontent.com/technomancy/leiningen/stable/bin/lein \
            -o /tmp/lein
          chmod +x /tmp/lein
          sudo mv /tmp/lein /usr/local/bin/lein
          lein version

      - name: Materialize pinned source dependencies
        run: make setup

      - name: Remove host-language forward declaration
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if ! grep -q '^(declare execute)$' db/src/gwdb/ledger/runtime_v2.clj; then
            exit 0
          fi
          sed -i '/^(declare execute)$/d' db/src/gwdb/ledger/runtime_v2.clj
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/src/gwdb/ledger/runtime_v2.clj
          git commit -m "Remove obsolete runtime forward declaration"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Generate SQL and contracts
        run: make db-sql db-contracts

      - name: Commit regenerated runtime artefacts
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          if git diff --quiet -- db/sql/full.sql db/contracts/ledger-client/generated.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/sql/full.sql db/contracts/ledger-client/generated.ts
          git commit -m "Regenerate recursive runtime artefacts"
          git push origin "HEAD:${TARGET_BRANCH}"

      - name: Test protocol and recursive runtime round trips
        run: |
          docker build \
            -t gw-ledger-postgres:15-pgsodium \
            -f db/Dockerfile.postgres15-pgsodium \
            db
          cd db
          lein update-in :dependencies conj \
            '[org.clojure/core.rrb-vector "0.1.2"]' \
            '[org.apache.commons/commons-math3 "3.6.1"]' -- \
            test gwdb.ledger.protocol-value-test \
                 gwdb.ledger.runtime-v2-demo-test

      - name: Test SHA extension
        run: make extension-sha-test