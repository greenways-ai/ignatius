name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  chain-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject Hestia application modules
        run: |
          set -euo pipefail
          if grep -R -n -E 'gwdb\.ledger\.(ot|document|document-protocol)' \
              db/src db/sql db/contracts; then
            echo "Hestia application modules must not enter Ignatius" >&2
            exit 1
          fi
          if grep -R -n -E '^\(ns gw\.ledger\.' hal extensions; then
            echo "Portable HAL must use Ignatius namespaces" >&2
            exit 1
          fi

      - name: Verify generated SQL and contracts
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y leiningen
          git clone --depth 1 https://github.com/zcaudate-xyz/foundation-base.git \
            db/checkouts/foundation
          (cd db && lein sql && lein contracts)
          rm -rf db/checkouts
          git diff --exit-code -- db/sql/full.sql db/contracts/ledger-client/generated.ts

      - name: Test SHA extension
        run: cargo test --manifest-path extensions/sha/rust/Cargo.toml
