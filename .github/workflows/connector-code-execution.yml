name: Connector code execution

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'agent/**'
      - 'chat/**'
      - 'codex/**'
      - 'copilot/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connector-code-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    outputs:
      architecture: ${{ steps.scope.outputs.architecture }}
      ledger: ${{ steps.scope.outputs.ledger }}
      adapters: ${{ steps.scope.outputs.adapters }}
      extensions: ${{ steps.scope.outputs.extensions }}
      website: ${{ steps.scope.outputs.website }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate the committed connector contract
        run: |
          bash -n scripts/connector/detect-code-scope scripts/connector/run-code
          scripts/connector/detect-code-scope --self-test
      - name: Select executable scopes
        id: scope
        env:
          CONNECTOR_BASE_REF: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch }}
          CONNECTOR_BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: scripts/connector/detect-code-scope

  architecture:
    needs: contract
    if: needs.contract.outputs.architecture == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute architecture scope
        run: scripts/connector/run-code architecture
      - name: Record execution evidence
        if: success()
        run: |
          mkdir -p connector-evidence
          cat > connector-evidence/architecture.txt <<EOF
          repository=greenways-ai/ignatius
          scope=architecture
          base=${{ github.event.pull_request.base.sha || github.event.before || 'manual' }}
          head=${{ github.sha }}
          run=${{ github.run_id }}
          attempt=${{ github.run_attempt }}
          command=scripts/connector/run-code architecture
          EOF
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: connector-architecture-${{ github.run_id }}-${{ github.run_attempt }}
          path: connector-evidence/architecture.txt
          if-no-files-found: error
          retention-days: 14

  ledger:
    needs: contract
    if: needs.contract.outputs.ledger == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute ledger scope
        run: scripts/connector/run-code ledger
      - name: Record execution evidence
        if: success()
        run: |
          mkdir -p connector-evidence
          cat > connector-evidence/ledger.txt <<EOF
          repository=greenways-ai/ignatius
          scope=ledger
          base=${{ github.event.pull_request.base.sha || github.event.before || 'manual' }}
          head=${{ github.sha }}
          run=${{ github.run_id }}
          attempt=${{ github.run_attempt }}
          command=scripts/connector/run-code ledger
          EOF
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: connector-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          path: connector-evidence/ledger.txt
          if-no-files-found: error
          retention-days: 14

  adapters:
    needs: contract
    if: needs.contract.outputs.adapters == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Execute adapters scope
        run: scripts/connector/run-code adapters
      - name: Record execution evidence
        if: success()
        run: |
          mkdir -p connector-evidence
          cat > connector-evidence/adapters.txt <<EOF
          repository=greenways-ai/ignatius
          scope=adapters
          base=${{ github.event.pull_request.base.sha || github.event.before || 'manual' }}
          head=${{ github.sha }}
          run=${{ github.run_id }}
          attempt=${{ github.run_attempt }}
          command=scripts/connector/run-code adapters
          EOF
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: connector-adapters-${{ github.run_id }}-${{ github.run_attempt }}
          path: connector-evidence/adapters.txt
          if-no-files-found: error
          retention-days: 14

  extensions:
    needs: contract
    if: needs.contract.outputs.extensions == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
      - name: Execute extensions scope
        run: scripts/connector/run-code extensions
      - name: Record execution evidence
        if: success()
        run: |
          mkdir -p connector-evidence
          cat > connector-evidence/extensions.txt <<EOF
          repository=greenways-ai/ignatius
          scope=extensions
          base=${{ github.event.pull_request.base.sha || github.event.before || 'manual' }}
          head=${{ github.sha }}
          run=${{ github.run_id }}
          attempt=${{ github.run_attempt }}
          command=scripts/connector/run-code extensions
          EOF
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: connector-extensions-${{ github.run_id }}-${{ github.run_attempt }}
          path: connector-evidence/extensions.txt
          if-no-files-found: error
          retention-days: 14

  website:
    needs: contract
    if: needs.contract.outputs.website == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Execute website scope
        run: scripts/connector/run-code website
      - name: Record execution evidence
        if: success()
        run: |
          mkdir -p connector-evidence
          cat > connector-evidence/website.txt <<EOF
          repository=greenways-ai/ignatius
          scope=website
          base=${{ github.event.pull_request.base.sha || github.event.before || 'manual' }}
          head=${{ github.sha }}
          run=${{ github.run_id }}
          attempt=${{ github.run_attempt }}
          command=scripts/connector/run-code website
          EOF
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: connector-website-${{ github.run_id }}-${{ github.run_attempt }}
          path: connector-evidence/website.txt
          if-no-files-found: error
          retention-days: 14

  evidence-gate:
    if: always()
    needs:
      - contract
      - architecture
      - ledger
      - adapters
      - extensions
      - website
    runs-on: ubuntu-latest
    steps:
      - name: Require a truthful connector result
        env:
          CONTRACT: ${{ needs.contract.result }}
          ARCHITECTURE: ${{ needs.architecture.result }}
          LEDGER: ${{ needs.ledger.result }}
          ADAPTERS: ${{ needs.adapters.result }}
          EXTENSIONS: ${{ needs.extensions.result }}
          WEBSITE: ${{ needs.website.result }}
        run: |
          set -euo pipefail
          test "$CONTRACT" = success
          for result in "$ARCHITECTURE" "$LEDGER" "$ADAPTERS" "$EXTENSIONS" "$WEBSITE"; do
            case "$result" in
              success|skipped) ;;
              *) echo "unexpected connector scope result: $result" >&2; exit 1 ;;
            esac
          done
