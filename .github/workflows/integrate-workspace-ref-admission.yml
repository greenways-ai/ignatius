name: Integrate workspace ref admission

on:
  push:
    branches: [agent/workspace-ref-admission]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/workspace-ref-admission

      - name: Wire admission source, tests and contracts
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"marker not found for {label}")
              return text.replace(old, new, 1)

          base_path = Path("db/src/gwdb/ledger/base.clj")
          base = base_path.read_text()
          marker = "            [gwdb.ledger.admission]\n            [gwdb.ledger.developer]"
          replacement = (
              "            [gwdb.ledger.admission]\n"
              "            [gwdb.ledger.workspace-admission]\n"
              "            [gwdb.ledger.developer]"
          )
          if base.count(marker) != 2:
              raise SystemExit("expected two base admission markers")
          base = base.replace(marker, replacement)
          base_path.write_text(base)

          workflow_path = Path(".github/workflows/verify.yml")
          workflow = workflow_path.read_text()
          workflow = replace_once(
              workflow,
              "Test workspace commits, scoped refs, protocol, runtime, actors and reducer contracts",
              "Test signed workspace refs, commits, scoped refs, protocol, runtime, actors and reducer contracts",
              "verify step name",
          )
          workflow = replace_once(
              workflow,
              "            test gwdb.ledger.workspace-test \\\n                 gwdb.ledger.scoped-ref-test \\",
              "            test gwdb.ledger.workspace-test \\\n                 gwdb.ledger.workspace-admission-test \\\n                 gwdb.ledger.scoped-ref-test \\",
              "workspace admission test",
          )
          workflow_path.write_text(workflow)

          test_path = Path("db/test/gwdb/ledger/workspace_admission_test.clj")
          test = test_path.read_text()
          test = replace_once(
              test,
              "        personal-row (scoped-ref/scoped-ref-row scope name)\n        main-row",
              "        personal-read\n        (scoped-ref/scoped-ref-read\n         scope name (hex-bytes address-hex))\n        main-row",
              "personal ref read",
          )
          test = replace_once(
              test,
              "     (json-field stale-result \"actual_root\")",
              "     (= (json-field stale-result \"actual_root\")\n        (bytes-hex c1))",
              "stale actual root",
          )
          test = replace_once(
              test,
              "     name\n     (= (bytes-hex (:bytea (json-field personal-row \"root\")))\n        (bytes-hex c3))",
              "     (= name (str \"user/\" address-hex))\n     (= (json-field personal-read \"root\")\n        (bytes-hex c3))",
              "personal name and root",
          )
          test = replace_once(
              test,
              "      \"conflict\" \"storage/ref-conflict\" #1\n      2\n      \"ok\" 3 true\n      \"workspace/world/orbital-station\" #2\n      true true true 4 :rejected :rejected true]",
              "      \"conflict\" \"storage/ref-conflict\" true\n      2\n      \"ok\" 3 true\n      \"workspace/world/orbital-station\" true\n      true true true 4 :rejected :rejected true]",
              "workspace admission expected result",
          )
          test_path.write_text(test)

          contract_path = Path("db/src/ledger/build_contract.clj")
          contract = contract_path.read_text()
          types_marker = "export interface LedgerDeveloperApi {"
          types = '''export interface WorkspaceRefSigningRequest {
  address: LedgerRoot;
  sequence: number;
  workspace_id_root: LedgerRoot;
  scope: string;
  name: string;
  expected_root?: LedgerRoot;
  desired_root: LedgerRoot;
  intent_root: LedgerRoot;
  operation_root: LedgerRoot;
  signing_payload: string;
}

export type WorkspaceRefSubmission =
  | {
      status: \"ok\";
      address: LedgerRoot;
      sequence: number;
      scope: string;
      name: string;
      expected_root?: LedgerRoot;
      desired_root: LedgerRoot;
      ref_version: number;
      intent_root: LedgerRoot;
      transaction_root: LedgerRoot;
      receipt_root: LedgerRoot;
      result_root: LedgerRoot;
      state_root: LedgerRoot;
      block_root: LedgerRoot;
    }
  | {
      status: \"conflict\";
      error: \"storage/ref-conflict\";
      address: LedgerRoot;
      sequence: number;
      scope: string;
      name: string;
      expected_root?: LedgerRoot;
      actual_root?: LedgerRoot;
      desired_root: LedgerRoot;
      version: number;
      intent_root: LedgerRoot;
    };

'''
          contract = replace_once(
              contract, types_marker, types + types_marker,
              "workspace ref contract types",
          )
          method_marker = (
              "  submitOfflineTransaction(submission: OfflineTransactionSubmission): "
              "Promise<SignedSubmission & { result_root?: LedgerRoot; cost_used: number }>;\n"
          )
          methods = method_marker + '''  workspaceRefSigningRequest(network: string, publicKey: string, workspaceIdRoot: LedgerRoot, expectedRoot: LedgerRoot | undefined, desiredRoot: LedgerRoot, costLimit?: number): Promise<WorkspaceRefSigningRequest>;
  submitWorkspaceRef(network: string, publicKey: string, sequence: number, workspaceIdRoot: LedgerRoot, expectedRoot: LedgerRoot | undefined, desiredRoot: LedgerRoot, signature: string, costLimit?: number): Promise<WorkspaceRefSubmission>;
'''
          contract = replace_once(
              contract, method_marker, methods,
              "workspace ref contract methods",
          )
          contract_path.write_text(contract)

          readme_path = Path("README.md")
          readme = readme_path.read_text()
          readme_marker = "## Convex-style accounts and actors"
          readme_section = '''## Signed personal workspace branches

The first signed workspace-ref policy lets a verified account advance only its
own `user/<address-root>` branch inside an explicit workspace scope. Ignatius
derives the scope, name and authorization root, validates verified commit
ancestry, performs exact PostgreSQL compare-and-set, and records each successful
selection through the ordinary signed transaction, receipt and linear block
chain. Stale selections do not consume the account sequence or advance the
network head.

Shared `main`, proposal and release refs remain policy-gated follow-up work. See
[`docs/workspace-ref-admission.md`](docs/workspace-ref-admission.md).

'''
          readme = replace_once(
              readme, readme_marker, readme_section + readme_marker,
              "README workspace admission section",
          )
          readme_path.write_text(readme)
          PY

          rm .github/workflows/integrate-workspace-ref-admission.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/src/gwdb/ledger/base.clj \
                  db/test/gwdb/ledger/workspace_admission_test.clj \
                  db/src/ledger/build_contract.clj \
                  .github/workflows/verify.yml \
                  README.md \
                  .github/workflows/integrate-workspace-ref-admission.yml
          git commit -m "Integrate signed workspace ref admission"
          git push origin HEAD:agent/workspace-ref-admission
