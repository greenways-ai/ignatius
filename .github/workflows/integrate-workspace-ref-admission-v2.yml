name: Integrate workspace ref admission v2

on:
  push:
    branches: [agent/workspace-ref-admission]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/workspace-ref-admission

      - name: Apply non-workflow integration patch
        run: |
          set -euo pipefail
          python scripts/integrate_workspace_ref_admission.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md \
                  db/src/gwdb/ledger/base.clj \
                  db/src/ledger/build_contract.clj \
                  db/test/gwdb/ledger/workspace_admission_test.clj
          git commit -m "Integrate signed workspace ref admission"
          git push origin HEAD:agent/workspace-ref-admission
