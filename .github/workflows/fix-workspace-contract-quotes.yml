name: Fix workspace contract quotes

on:
  push:
    branches: [agent/workspace-ref-admission]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/workspace-ref-admission

      - name: Escape TypeScript literals in the Clojure string
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("db/src/ledger/build_contract.clj")
          text = path.read_text()
          replacements = {
              '      status: "ok";': '      status: \\"ok\\";',
              '      status: "conflict";': '      status: \\"conflict\\";',
              '      error: "storage/ref-conflict";': '      error: \\"storage/ref-conflict\\";',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f"missing contract marker: {old}")
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add db/src/ledger/build_contract.clj
          git commit -m "Escape workspace contract literals"
          git push origin HEAD:agent/workspace-ref-admission
