name: Record clean HCV1 flat-map benchmark evidence

on:
  push:
    branches: [agent/hpt1-flat-map-measurements-pr]

concurrency:
  group: hpt1-flat-map-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/hpt1-flat-map-measurements-pr

      - name: Skip an already recorded complete snapshot
        id: existing
        run: |
          set -euo pipefail
          evidence=benchmarks/hpt1-flat-map/evidence.edn
          if [ -f "$evidence" ] \
             && [ "$(grep -c ':status :ok' "$evidence" || true)" -eq 5 ] \
             && ! grep -q ':status :error' "$evidence"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            rm -f "$evidence"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Leiningen
        if: steps.existing.outputs.present != 'true'
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-delay 2 \
            https://raw.githubusercontent.com/technomancy/leiningen/stable/bin/lein \
            -o /tmp/lein
          chmod +x /tmp/lein
          sudo mv /tmp/lein /usr/local/bin/lein
          lein version

      - name: Record flat-map measurements
        if: steps.existing.outputs.present != 'true'
        env:
          HPT1_BENCHMARK_COUNTS: 16,64,256,1024,4096
          HPT1_BENCHMARK_WARMUPS: 2
          HPT1_BENCHMARK_SAMPLES: 7
        run: |
          set +e
          set -o pipefail
          rm -f /tmp/clojure-*.edn /tmp/hpt1-flat-map-benchmark.log
          make hpt1-flat-map-benchmark 2>&1 | tee /tmp/hpt1-flat-map-benchmark.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::group::Benchmark output"
            tail -n 300 /tmp/hpt1-flat-map-benchmark.log
            for report in /tmp/clojure-*.edn; do
              [ -f "$report" ] && { echo "--- $report"; cat "$report"; }
            done
            echo "::endgroup::"
            exit "$status"
          fi

      - name: Validate measured evidence
        if: steps.existing.outputs.present != 'true'
        run: |
          set -euo pipefail
          evidence=benchmarks/hpt1-flat-map/evidence.edn
          test -s "$evidence"
          test "$(grep -c ':status :ok' "$evidence" || true)" -eq 5
          ! grep -q ':status :error' "$evidence"
          grep -q ':evidence/kind :hcv1-flat-map-jdbc-baseline' "$evidence"
          grep -q ':timing/scope :jdbc-round-trip' "$evidence"
          for entry_count in 16 64 256 1024 4096; do
            grep -q ":entry-count $entry_count" "$evidence"
          done

      - name: Commit measured evidence
        if: steps.existing.outputs.present != 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmarks/hpt1-flat-map/evidence.edn
          git commit -m "Record clean HCV1 flat-map benchmark evidence"
          git push origin HEAD:agent/hpt1-flat-map-measurements-pr
