name: Integrate workspace release admission

on:
  push:
    branches: [agent/workspace-release-publication]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/workspace-release-publication

      - name: Wire release source, contracts and documentation
        run: |
          set -euo pipefail
          if [ ! -f scripts/integrate_workspace_release.py ]; then
            exit 0
          fi
          python scripts/integrate_workspace_release.py
          rm scripts/integrate_workspace_release.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md \
                  hal/src/ignatius/workspace_release.hal \
                  db/src/gwdb/ledger/base.clj \
                  db/src/ledger/build_contract.clj \
                  scripts/integrate_workspace_release.py
          git commit -m "Integrate signed workspace release admission"
          git push origin HEAD:agent/workspace-release-publication
